name: JCIL CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Backend CI (NestJS)
  backend-ci:
    name: Backend (NestJS) CI
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jcil_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to required version
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm install

      - name: Run ESLint (Code Quality)
        working-directory: apps/api
        run: npm run lint

      - name: Run Unit Tests
        working-directory: apps/api
        run: npm run test
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/jcil_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

  # Frontend CI (Next.js)
  frontend-ci:
    name: Frontend (Next.js) CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to required version
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        working-directory: apps/web
        run: npm run lint

      - name: Build Next.js App
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  # Shared Package CI
  shared-ci:
    name: Shared Package CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade npm to required version
        run: npm install -g npm@11.18.0

      - name: Install dependencies
        run: npm install

      - name: Build Shared Package
        working-directory: packages/shared
        run: npm run build