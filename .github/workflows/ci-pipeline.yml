name: JCIL CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # Backend CI (NestJS)
  backend-ci:
    name: Backend (NestJS) CI
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jcil_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Code Quality)
        run: npm run lint --workspace=apps/api
        continue-on-error: false

      - name: Run Unit Tests
        run: npm run test --workspace=apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/jcil_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

      - name: Run Integration Tests
        run: npm run test:e2e --workspace=apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/jcil_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672

  # Frontend CI (Next.js)
  frontend-ci:
    name: Frontend (Next.js) CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --workspace=apps/web
        continue-on-error: false

      - name: Type Check
        run: npm run type-check --workspace=apps/web || npx tsc --noEmit --project apps/web

      - name: Build Next.js App
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  # Shared Package CI
  shared-ci:
    name: Shared Package CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared